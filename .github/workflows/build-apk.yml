# Builds the debug APK on GitHub's machines (they have the Android SDK) and publishes it as
# vitrine-home.apk on the "apk-builds" branch, so a TV can be set up from any computer with just adb.
name: Build APK
on:
  push:
    branches: [ci]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Same signing key every build (so a new APK installs over the old one)
        run: mkdir -p ~/.android && cp ci/debug.keystore ~/.android/debug.keystore
      - name: Build
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon assembleDebug 2>&1 | tee /tmp/build.log
      - name: On failure, publish the build log to the build-logs branch
        if: failure()
        run: |
          git config user.name "Vitrine Home CI"; git config user.email "noreply@users.noreply.github.com"
          cp /tmp/build.log /tmp/keep.log || true
          git checkout --orphan build-logs && git rm -rf --quiet . && cp /tmp/keep.log build.log
          git add build.log && git commit -m "Failed build of ${GITHUB_SHA::7}" && git push -f origin build-logs
      - name: Publish to the apk-builds branch
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/vitrine-home.apk
          git config user.name "Vitrine Home CI"
          git config user.email "noreply@users.noreply.github.com"
          git checkout --orphan apk-builds
          git rm -rf --quiet .
          cp /tmp/vitrine-home.apk vitrine-home.apk
          echo "${GITHUB_SHA}" > built-from.txt
          git add vitrine-home.apk built-from.txt
          git commit -m "APK built from ${GITHUB_SHA::7}"
          git push -f origin apk-builds
